document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Noto Sans Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"fe8cb37d-324e-4458-9408-d836500ddb14\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html, body { margin: 0; padding: 0; background: #edece7; }\n  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n  button { font-family: inherit; border: 0; cursor: pointer; }\n  input { font-family: inherit; }\n  a { color: #1d5c48; text-decoration: none; }\n  a:hover { color: #12402f; }\n  ::-webkit-scrollbar { width: 6px; height: 6px; }\n  ::-webkit-scrollbar-thumb { background: #d2d0c8; border-radius: 3px; }\n  @keyframes riseIn { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }\n  @keyframes popIn { from { transform: scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }\n  @keyframes spin { to { transform: rotate(360deg) } }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"min-height: 100vh; background: #edece7; color: #16181c; font-family: 'Noto Sans Devanagari', system-ui, sans-serif; line-height: 1.6; text-wrap: pretty; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 22px 22px 48px;\">\n\n  <div style=\"width: 100%; max-width: 1240px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between;\">\n    <div>\n      <div style=\"font-size: 14px; font-family: 'Noto Sans Mono', monospace; color: #7a7d84; letter-spacing: .06em;\">QUICKPOS / DESIGN TOKENS APPLIED<\u002Fdiv>\n      <div style=\"font-size: 24px; font-weight: 700; letter-spacing: -.015em;\">Counter service — one screen<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size: 15px; color: #6a6d74; max-width: 420px;\">Same structure as the Tailwind draft, rebuilt on the POS token set: warm neutrals, one action green, amber for held, red for destructive.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width: 100%; max-width: 1240px; display: flex; align-items: stretch; gap: 0; border-radius: 18px; overflow: hidden; border: 1.5px solid #d2d0c8; background: #f7f6f2; min-height: 780px; box-shadow: 0 24px 56px -30px rgba(0,0,0,.4);\">\n\n    <!-- ── MAIN ── -->\n    <div style=\"flex: 1; min-width: 0; display: flex; flex-direction: column;\">\n\n      <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px 14px;\">\n        <div>\n          <div style=\"font-size: 22px; font-weight: 700; line-height: 1.3;\">{{ shopName }}<\u002Fdiv>\n          <div style=\"font-size: 15px; color: #6a6d74; font-family: 'Noto Sans Mono', monospace;\">{{ clock }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 10px;\">\n          <button sc-camel-on-click=\"{{ holdOrder }}\" style=\"min-height: 64px; padding: 0 18px; border-radius: 14px; background: #ffffff; border: 2px solid #d2d0c8; font-size: 17px; font-weight: 600; color: #16181c; display: flex; align-items: center; gap: 8px;\" style-hover=\"border-color: #a97400;\">\n            <span style=\"font-family: 'Noto Sans Mono', monospace; font-size: 18px; color: #a97400;\">❚❚<\u002Fspan>\n            <span>Hold<\u002Fspan>\n          <\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openHeld }}\" style=\"position: relative; min-height: 64px; padding: 0 18px; border-radius: 14px; background: #ffffff; border: 2px solid #d2d0c8; font-size: 17px; font-weight: 600; color: #16181c; display: flex; align-items: center; gap: 10px;\" style-hover=\"border-color: #16181c;\">\n            <span>Held orders<\u002Fspan>\n            <span style=\"min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; background: {{ heldBadgeBg }}; color: {{ heldBadgeFg }}; font-family: 'Noto Sans Mono', monospace; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center;\">{{ heldCount }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 0 22px 12px; display: flex; align-items: center; gap: 10px; \">\n        <div style=\"flex: 1; display: flex; align-items: center; gap: 10px; background: #ffffff; border: 2px solid #d2d0c8; border-radius: 14px; padding: 0 16px; height: 64px;\">\n          <span style=\"font-family: 'Noto Sans Mono', monospace; font-size: 18px; color: #7a7d84;\">⌕<\u002Fspan>\n          <input value=\"{{ query }}\" sc-camel-on-change=\"{{ setQuery }}\" placeholder=\"Search menu\" style=\"flex: 1; border: 0; outline: none; background: transparent; font-size: 19px; color: #16181c; height: 100%;\">\n          <sc-if value=\"{{ hasQuery }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ clearQuery }}\" style=\"width: 40px; height: 40px; border-radius: 10px; background: #e4e2da; font-size: 18px; color: #4a4d54;\">✕<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding: 0 22px 14px; display: flex; gap: 8px; flex-wrap: wrap;\">\n        <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"6\">\n          <button sc-camel-on-click=\"{{ c.pick }}\" style=\"min-height: 52px; padding: 0 18px; border-radius: 999px; font-size: 17px; font-weight: 600; border: 2px solid {{ c.border }}; background: {{ c.bg }}; color: {{ c.fg }};\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1; overflow: auto; padding: 0 22px 22px;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 12px; align-content: start;\">\n          <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ p.add }}\" style=\"position: relative; min-height: 132px; padding: 14px 14px 12px; border-radius: 16px; background: #ffffff; border: 2px solid #dddbd3; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; text-align: left; overflow: hidden;\" style-hover=\"border-color: #16181c;\" style-active=\"border-color: #1d5c48; background: #e8f2ee;\">\n              <span style=\"position: absolute; top: 0; left: 0; right: 0; height: 4px; background: {{ p.accent }};\"><\u002Fspan>\n              <span style=\"display: flex; align-items: center; gap: 10px; width: 100%;\">\n                <span style=\"width: 40px; height: 40px; border-radius: 10px; background: {{ p.chipBg }}; color: {{ p.accent }}; font-family: 'Noto Sans Mono', monospace; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;\">{{ p.initials }}<\u002Fspan>\n                <span style=\"flex: 1; font-size: 18px; font-weight: 600; line-height: 1.35;\">{{ p.name }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display: flex; align-items: center; justify-content: space-between; width: 100%;\">\n                <span style=\"font-size: 19px; font-weight: 700; font-family: 'Noto Sans Mono', monospace; color: #16181c;\">{{ p.priceText }}<\u002Fspan>\n                <span style=\"font-size: 16px; font-weight: 700; font-family: 'Noto Sans Mono', monospace; color: #1d5c48;\">{{ p.qtyBadge }}<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding: 70px 20px; text-align: center; color: #7a7d84; font-size: 19px;\">No items match “{{ query }}”. Clea n a guest steps away.<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ heldList }}\" as=\"h\" hint-placeholder-count=\"2\">\n          <div style=\"display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; background: #ffffff; border: 2px solid #dddbd3; border-left: 6px solid #f0b429;\">\n            <div style=\"flex: 1; min-width: 0;\">\n              <div style=\"font-size: 19px; font-weight: 700;\">{{ h.summary }}<\u002Fdiv>\n              <div style=\"font-size: 15px; color: #6a6d74; font-family: 'Noto Sans Mono', monospace;\">{{ h.time }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size: 20px; font-weight: 700; font-family: 'Noto Sans Mono', monospace;\">{{ h.total }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ h.restore }}\" style=\"min-height: 56px; padding: 0 18px; border-radius: 12px; background: #1d5c48; color: #f2f7f4; font-size: 17px; font-weight: 700;\">Restore<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ h.remove }}\" style=\"width: 56px; height: 56px; border-radius: 12px; background: #ffffff; border: 2px solid #b4231d; color: #b4231d; font-size: 18px; font-weight: 700;\">✕<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ── TOAST ── -->\n  <sc-if value=\"{{ hasToast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; z-index: 90; left: 50%; transform: translateX(-50%); bottom: 28px; display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 14px; background: #16181c; color: #f7f6f2; animation: riseIn .16s ease-out; box-shadow: 0 18px 40px -18px rgba(0,0,0,.6);\">\n      <span style=\"font-size: 18px; font-weight: 600;\">{{ toastText }}<\u002Fspan>\n      <sc-if value=\"{{ toastUndoable }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ undo }}\" style=\"padding: 12px 16px; border-radius: 10px; background: #f0b429; color: #22190a; font-size: 17px; font-weight: 700;\">Undo<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1300,&quot;height&quot;:900},&quot;shopName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;The Brew House&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Shop&quot;},&quot;taxRate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:8,&quot;min&quot;:0,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Shop&quot;}}\">\nclass Component extends DCLogic {\n  CATS = [\n    { id:'all',    name:'All',         accent:'#16181c', chip:'#e4e2da' },\n    { id:'coffee', name:'Coffee',      accent:'#1d5c48', chip:'#e8f2ee' },\n    { id:'tea',    name:'Tea',         accent:'#3d4249', chip:'#e9e8e2' },\n    { id:'pastry', name:'Pastry',      accent:'#a97400', chip:'#fdf3dc' },\n    { id:'food',   name:'Food',        accent:'#4a4d54', chip:'#e9e8e2' },\n    { id:'cold',   name:'Cold drinks', accent:'#1d5c48', chip:'#e8f2ee' },\n  ];\n  PRODUCTS = [\n    { id:1,  name:'Espresso',         price:350,  cat:'coffee' },\n    { id:2,  name:'Americano',        price:400,  cat:'coffee' },\n    { id:3,  name:'Latte',            price:550,  cat:'coffee' },\n    { id:4,  name:'Cappuccino',       price:500,  cat:'coffee' },\n    { id:5,  name:'Mocha',            price:600,  cat:'coffee' },\n    { id:6,  name:'Flat White',       price:550,  cat:'coffee' },\n    { id:7,  name:'Green Tea',        price:350,  cat:'tea' },\n    { id:8,  name:'Chamomile',        price:350,  cat:'tea' },\n    { id:9,  name:'Earl Grey',        price:400,  cat:'tea' },\n    { id:10, name:'Matcha Latte',     price:550,  cat:'tea' },\n    { id:11, name:'Croissant',        price:350,  cat:'pastry' },\n    { id:12, name:'Blueberry Muffin', price:400,  cat:'pastry' },\n    { id:13, name:'Scone',            price:350,  cat:'pastry' },\n    { id:14, name:'Cinnamon Roll',    price:450,  cat:'pastry' },\n    { id:15, name:'Club Sandwich',    price:850,  cat:'food' },\n    { id:16, name:'Caesar Salad',     price:900,  cat:'food' },\n    { id:17, name:'Grilled Panini',   price:750,  cat:'food' },\n    { id:18, name:'Chicken Wrap',     price:800,  cat:'food' },\n    { id:19, name:'Iced Latte',       price:600,  cat:'cold' },\n    { id:20, name:'Berry Smoothie',   price:650,  cat:'cold' },\n    { id:21, name:'Lemonade',         price:450,  cat:'cold' },\n    { id:22, name:'Cold Brew',        price:500,  cat:'cold' },\n  ];\n\n  state = {\n    cart: [], cat: 'all', query: '', held: [], orderNo: 42,\n    payOpen: false, method: null, cashInput: '', cardStage: null,\n    receipt: null, heldOpen: false, toast: null, now: Date.now(),\n  };\n\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n    [this.toastTimer, this.cardTimer, this.cardTimer2].forEach(t => t && clearTimeout(t));\n  }\n\n  taxRate() { return this.props.taxRate ?? 8; }\n  money(c) {\n    const s = (c / 100).toFixed(2).split('.');\n    return '$' + s[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, ',') + '.' + s[1];\n  }\n  cat(id) { return this.CATS.find(c => c.id === id) || this.CATS[0]; }\n  initials(name) { return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase(); }\n  subtotal() { return this.state.cart.reduce((s, l) => s + l.price * l.qty, 0); }\n  tax() { return Math.round(this.subtotal() * this.taxRate() / 100); }\n  total() { return this.subtotal() + this.tax(); }\n\n  toast(text, undoFn) {\n    if (this.toastTimer) clearTimeout(this.toastTimer);\n    this.setState({ toast: { text, fn: undoFn || null } });\n    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 5000);\n  }\n\n  add(id) {\n    return () => this.setState(s => {\n      const cart = s.cart.slice();\n      const i = cart.findIndex(l => l.id === id);\n      if (i >= 0) cart[i] = { ...cart[i], qty: cart[i].qty + 1 };\n      else { const p = this.PRODUCTS.find(x => x.id === id); cart.push({ ...p, qty: 1 }); }\n      return { cart };\n    });\n  }\n  bump(id, d) {\n    return () => this.setState(s => {\n      let cart = s.cart.slice();\n      const i = cart.findIndex(l => l.id === id);\n      if (i < 0) return {};\n      const q = cart[i].qty + d;\n      if (q <= 0) cart.splice(i, 1); else cart[i] = { ...cart[i], qty: q };\n      return { cart };\n    });\n  }\n\n  completeOrder(method) {\n    const cart = this.state.cart, sub = this.subtotal(), tax = this.tax(), total = this.total();\n    const cash = method === 'Cash' ? Math.round(parseFloat(this.state.cashInput || '0') * 100) : 0;\n    const d = new Date();\n    const orderNo = this.state.orderNo + 1;\n    this.setState({\n      orderNo, payOpen: false, method: null, cashInput: '', cardStage: null, cart: [],\n      receipt: {\n        orderNo: '#' + String(orderNo).padStart(4, '0'),\n        stamp: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '  ' +\n               d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),\n        lines: cart.map(l => ({ label: l.qty + '× ' + l.name, amount: this.money(l.price * l.qty) })),\n        totals: [\n          { label: 'Subtotal', amount: this.money(sub) },\n          { label: 'Tax (' + this.taxRate() + '%)', amount: this.money(tax) },\n        ],\n        total: this.money(total),\n        tender: method === 'Cash'\n          ? [{ label: 'Cash', amount: this.money(cash) }, { label: 'Change', amount: this.money(Math.max(0, cash - total)) }]\n          : [{ label: 'Payment', amount: 'Card' }],\n      },\n    });\n  }\n\n  renderVals() {\n    const s = this.state;\n    const q = s.query.trim().toLowerCase();\n    const items = this.PRODUCTS.filter(p =>\n      (s.cat === 'all' || p.cat === s.cat) && (!q || p.name.toLowerCase().includes(q)));\n    const total = this.total(), sub = this.subtotal();\n    const count = s.cart.reduce((a, l) => a + l.qty, 0);\n    const cashCents = s.cashInput ? Math.round(parseFloat(s.cashInput) * 100) : 0;\n    const change = cashCents - total;\n    const ok = !!s.cashInput && change >= 0;\n\n    const exact = Math.ceil(total / 100);\n    const quick = [exact, ...[10, 20, 50, 100].filter(b => b > exact)].slice(0, 4);\n\n    const d = new Date(s.now);\n\n    return {\n      shopName: this.props.shopName ?? 'The Brew House',\n      shopNameUpper: (this.props.shopName ?? 'The Brew House').toUpperCase(),\n      clock: d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + '   ' +\n             d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),\n\n      query: s.query, hasQuery: !!s.query,\n      setQuery: e => this.setState({ query: e.target.value }),\n      clearQuery: () => this.setState({ query: '' }),\n\n      cats: this.CATS.map(c => ({\n        label: c.name, pick: () => this.setState({ cat: c.id }),\n        bg: s.cat === c.id ? '#16181c' : '#ffffff',\n        border: s.cat === c.id ? '#16181c' : '#d2d0c8',\n        fg: s.cat === c.id ? '#f7f6f2' : '#4a4d54',\n      })),\n\n      products: items.map(p => {\n        const line = s.cart.find(l => l.id === p.id);\n        const c = this.cat(p.cat);\n        return {\n          name: p.name, priceText: this.money(p.price), add: this.add(p.id),\n          accent: c.accent, chipBg: c.chip, initials: this.initials(p.name),\n          qtyBadge: line ? '× ' + line.qty : '',\n        };\n      }),\n      noResults: items.length === 0,\n\n      cartEmpty: !s.cart.length,\n      cartLines: s.cart.map(l => ({\n        name: l.name, qty: String(l.qty),\n        eachText: this.money(l.price) + ' each',\n        lineText: this.money(l.price * l.qty),\n        inc: this.bump(l.id, 1), dec: this.bump(l.id, -1),\n      })),\n      clearFg: s.cart.length ? '#b4231d' : '#a9aab0',\n      clearCart: () => {\n        if (!s.cart.length) return;\n        const keep = s.cart;\n        this.setState({ cart: [] });\n        this.toast('Cart cleared', () => this.setState({ cart: keep, toast: null }));\n      },\n\n      totalsRows: [\n        { label: 'Subtotal', value: this.money(sub) },\n        { label: 'Tax (' + this.taxRate() + '%)', value: this.money(this.tax()) },\n      ],\n      totalText: this.money(total),\n      payLabel: s.cart.length ? 'Pay  ' + this.money(total) : 'Add items to pay',\n      payBg: s.cart.length ? '#1d5c48' : '#cfccc2',\n      payFg: s.cart.length ? '#f2f7f4' : '#7a7d84',\n      openPay: () => { if (s.cart.length) this.setState({ payOpen: true, method: null, cashInput: '', cardStage: null }); },\n      closePay: () => this.setState({ payOpen: false, method: null, cardStage: null }),\n      payOpen: s.payOpen,\n\n      methods: [['cash', 'Cash'], ['card', 'Card']].map(([k, label]) => ({\n        label,\n        bg: s.method === k ? '#e8f2ee' : '#ffffff',\n        border: s.method === k ? '#1d5c48' : '#d2d0c8',\n        fg: '#16181c',\n        pick: () => {\n          if (k === 'card') {\n            this.setState({ method: 'card', cardStage: 'pending' });\n            this.cardTimer = setTimeout(() => {\n              this.setState({ cardStage: 'approved' });\n              this.cardTimer2 = setTimeout(() => this.completeOrder('Card'), 700);\n            }, 1500);\n          } else this.setState({ method: 'cash', cardStage: null });\n        },\n      })),\n\n      cashMode: s.method === 'cash', cardMode: s.method === 'card',\n      cardPending: s.cardStage === 'pending', cardApproved: s.cardStage === 'approved',\n      cardStatus: s.cardStage === 'approved' ? 'Payment approved' : 'Tap or insert card…',\n      cardFg: s.cardStage === 'approved' ? '#1d5c48' : '#6a6d74',\n\n      quickAmounts: quick.map(a => {\n        const active = s.cashInput === String(a);\n        return {\n          label: '$' + a, pick: () => this.setState({ cashInput: String(a) }),\n          bg: active ? '#e8f2ee' : '#ffffff',\n          border: active ? '#1d5c48' : '#d2d0c8',\n          fg: active ? '#1d5c48' : '#16181c',\n        };\n      }),\n      cashInput: s.cashInput,\n      setCash: e => this.setState({ cashInput: e.target.value.replace(/[^\\d.]/g, '') }),\n      changeLabel: !s.cashInput ? 'Change' : change < 0 ? 'Short by' : 'Change',\n      changeText: !s.cashInput ? this.money(0) : this.money(Math.abs(change)),\n      changeBg: !s.cashInput ? '#e4e2da' : change < 0 ? '#b4231d' : '#1d5c48',\n      changeFg: !s.cashInput ? '#7a7d84' : '#ffffff',\n      confirmBg: ok ? '#1d5c48' : '#cfccc2',\n      confirmFg: ok ? '#f2f7f4' : '#7a7d84',\n      confirmCash: () => { if (ok) this.completeOrder('Cash'); },\n\n      receiptOpen: !!s.receipt, receipt: s.receipt,\n      printReceipt: () => window.print(),\n      newOrder: () => this.setState({ receipt: null }),\n\n      heldCount: String(s.held.length),\n      heldBadgeBg: s.held.length ? '#f0b429' : '#e4e2da',\n      heldBadgeFg: s.held.length ? '#22190a' : '#7a7d84',\n      holdOrder: () => {\n        if (!s.cart.length) { this.toast('Nothing to hold'); return; }\n        const parked = s.cart;\n        this.setState(st => ({ held: st.held.concat([{ items: parked, at: Date.now() }]), cart: [] }));\n        this.toast('Order held', () => this.setState(st => ({ cart: parked, held: st.held.slice(0, -1), toast: null })));\n      },\n      heldOpen: s.heldOpen, heldEmpty: !s.held.length,\n      heldTitle: s.held.length ? 'Held orders (' + s.held.length + ')' : 'Held orders',\n      openHeld: () => this.setState({ heldOpen: true }),\n      closeHeld: () => this.setState({ heldOpen: false }),\n      heldList: s.held.map((h, i) => {\n        const n = h.items.reduce((a, l) => a + l.qty, 0);\n        const t = h.items.reduce((a, l) => a + l.price * l.qty, 0);\n        return {\n          summary: n + (n === 1 ? ' item' : ' items') + ' · ' + h.items.map(l => l.name).slice(0, 2).join(', ') + (h.items.length > 2 ? '…' : ''),\n          time: new Date(h.at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),\n          total: this.money(t),\n          restore: () => this.setState(st => ({\n            cart: st.cart.concat(h.items.filter(x => !st.cart.some(c => c.id === x.id))),\n            held: st.held.filter((_, j) => j !== i), heldOpen: false,\n          })),\n          remove: () => this.setState(st => ({ held: st.held.filter((_, j) => j !== i) })),\n        };\n      }),\n\n      hasToast: !!s.toast,\n      toastText: s.toast ? s.toast.text : '',\n      toastUndoable: !!(s.toast && s.toast.fn),\n      undo: () => { if (s.toast && s.toast.fn) s.toast.fn(); },\n      cardCount: count,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
